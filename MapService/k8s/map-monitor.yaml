apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: map-app-monitor
  namespace: test
  labels:
    release: my-prometheus
spec:
  selector:
    matchLabels:
      app: map-app
  namespaceSelector:
    matchNames:
      - test
  endpoints:
    - port: http-map
      path: /actuator/prometheus
      interval: 15s
    - port: status-port # Use the new port name
      path: /stats/prometheus
      interval: 15s