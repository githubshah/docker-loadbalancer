apiVersion: apps/v1
kind: Deployment
metadata:
  name: map-deployment
  namespace: test
  labels:
    app: map-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: map-app
  template:
    metadata:
      labels:
        app: map-app
      annotations:
        # These annotations tell Prometheus to scrape this pod
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8081"
    spec:
      containers:
        - name: map-container
          image: map:1.1
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: map-service
  namespace: test
spec:
  type: ClusterIP
  selector:
    app: map-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8081