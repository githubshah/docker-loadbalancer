# Deployment V2 (Fixed selector to match template labels)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: map-deployment-v2
  namespace: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: map-app   # Standardize this
      version: v2    # Specific to this version
  template:
    metadata:
      labels:
        app: map-app
        version: v2
    spec:
      containers:
        - name: map-container
          image: map:1.0 # Ensure this is your v2 image
          ports:
            - name: http-map
              containerPort: 8081