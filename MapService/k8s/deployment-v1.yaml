apiVersion: apps/v1
kind: Deployment
metadata:
  name: map-deployment-v1 # Changed name to include version
  namespace: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: map-app
  template:
    metadata:
      annotations:
        # This tells Prometheus to bypass the Service and hit the Pod directly
        prometheus.io/scrape: "true"
        prometheus.io/path: "/stats/prometheus"
        prometheus.io/port: "15020"
      labels:
        app: map-app
        version: v1    # Added version label
    spec:
      containers:
        - name: map-container
          image: map:1.0
          ports:
            - name: http-map  # Named port at the container level
              containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: map-service
  namespace: test
  labels:
    app: map-app
    release: my-prometheus  # Added to ensure the Operator picks it up
spec:
  type: NodePort
  selector:
    app: map-app
  ports:
    - name: http-map  # Must match the ServiceMonitor port field
      protocol: TCP
      port: 80
      targetPort: 8081
      nodePort: 30081
    - name: status-port # Add this for Istio metrics
      port: 15020
      targetPort: 15020