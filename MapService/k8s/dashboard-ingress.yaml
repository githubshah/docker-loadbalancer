apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard-ingress
  namespace: kubernetes-dashboard
  annotations:
    # Essential: Tells NGINX the backend service expects HTTPS
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    # Optional: Increases the max body size for uploading files through the UI
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
spec:
  ingressClassName: nginx
  # Recommendation: Add a TLS section for your domain (mydashboard.com)
  # to secure the connection from your browser to the Ingress.
  rules:
    - host: "mydashboard.com"
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: kubernetes-dashboard
                port:
                  number: 443