apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard-ingress
  namespace: kubernetes-dashboard
spec:
  ingressClassName: nginx
  rules:
    - host: "map-app-service.com"
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: map-service
                port:
                  number: 80