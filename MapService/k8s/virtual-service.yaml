apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: map-ingress
  namespace: test
spec:
  hosts:
    - "map.com"
  gateways:
    - test-gateway
  http:
    - match:
        - uri:
            prefix: /map
      rewrite:
        uri: /
      route:
        - destination:
            host: map-service.test.svc.cluster.local
            subset: v1
          weight: 90
        - destination:
            host: map-service.test.svc.cluster.local
            subset: v2
          weight: 10