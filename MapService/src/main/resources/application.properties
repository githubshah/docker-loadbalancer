server.port=8081

# Expose the prometheus endpoint along with health and info
management.endpoints.web.exposure.include=health,info,prometheus

# Enable the prometheus endpoint explicitly
management.endpoint.prometheus.enabled=true

# Enable histograms for HTTP server requests to calculate P95/P99 latencies in Grafana
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Tracing sampling: 1.0 means 100% of requests are traced (use lower values like 0.1 in high-traffic production)
management.tracing.sampling.probability=1.0